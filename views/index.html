<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
/>

<title>Web3 Wi-Fi Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<link rel="stylesheet" href="/style.css"/>

</head>

<body>

<div class="container">

    <div class="logo">📶</div>

    <h1>Web3 Wi-Fi</h1>

    <div class="subtitle">
        Pay for internet access using Ethereum smart contracts.
        Secure. Decentralized. Instant.
    </div>

    <div class="card">
        <div class="label">Wallet</div>

        <div class="value" id="wallet">
            Not connected
        </div>
    </div>

    <div class="card">

        <div class="label">
            Connection Status
        </div>

        <div class="status">

            <div
                class="dot"
                id="statusDot"
            ></div>

            <div
                class="value"
                id="statusText"
            >
                No access
            </div>

        </div>
    </div>

    <div class="network">
        <div>Ethereum Sepolia</div>
        <div>Smart Wi-Fi Portal</div>
    </div>

    <div class="buttons">

        <button
            class="primary"
            onclick="connectWallet()"
        >
            🔐 Connect Wallet
        </button>

        <button
            class="primary"
            onclick="deposit()"
        >
            💰 Deposit 0.01 ETH
        </button>

        <button
            class="secondary"
            onclick="startSession()"
        >
            🚀 Start Internet Session
        </button>

        <button
            class="secondary"
            onclick="checkAccess()"
        >
            🔍 Check Access
        </button>

        <button
            class="secondary"
            onclick="endSession()"
        >
            🛑 End Session
        </button>

    </div>

    <div class="loader" id="loader">
        Processing blockchain transaction...
    </div>

</div>

const contractAddress =
    "";
</script>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>

<script src="/app.js"></script>

</body>
</html>
